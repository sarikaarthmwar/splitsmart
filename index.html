<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="SplitSmart makes shared expenses simple." />
    <title>SplitSmart</title>
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { min-width: 320px; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #root { min-height: 100vh; }
      .boot-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f7f7f7; color: #222; }
      .boot-card { width: min(100%, 560px); box-sizing: border-box; border: 1px solid #ddd; border-radius: 16px; padding: 24px; background: white; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
      .boot-title { margin: 0; font-size: 20px; font-weight: 700; }
      .boot-text { margin: 8px 0 0; color: #666; }
      .boot-error { margin-top: 16px; white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; border-radius: 10px; background: #f1f1f1; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" data-boot-screen>
        <div class="boot-card">
          <h1 class="boot-title">Starting SplitSmart…</h1>
          <p class="boot-text">Loading the application.</p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        function showError(message) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '';
          var screen = document.createElement('div');
          screen.className = 'boot-screen';
          var card = document.createElement('div');
          card.className = 'boot-card';
          var title = document.createElement('h1');
          title.className = 'boot-title';
          title.textContent = 'SplitSmart could not start';
          var text = document.createElement('p');
          text.className = 'boot-text';
          text.textContent = 'A browser-side startup error occurred.';
          var error = document.createElement('div');
          error.className = 'boot-error';
          error.textContent = String(message || 'Unknown startup error');
          card.appendChild(title);
          card.appendChild(text);
          card.appendChild(error);
          screen.appendChild(card);
          root.appendChild(screen);
        }
        window.addEventListener('error', function (event) {
          showError(event.error && event.error.stack ? event.error.stack : event.message);
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showError(reason && reason.stack ? reason.stack : String(reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
